[firmware]
config = "marble"
dsc = "Platforms/Xiaomi/marblePkg/marble.dsc"
fd = "Build/marblePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "marble"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "marble"

[payload]
volume = "MARBLEESP"
size_mib = 192
loader = "firmware"
title = "UniXNU"
dram_size = "0x400000000"
panic_screen = true
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=1", "armcpu-diagnostics=1", "-no_slto_panic", "early_console=1", "-enable_kprintf_spam", "startup_debug=1", "sheng-pmgr=2"]

[payload.adt]
tool = "scripts/make-marble-adt.py"
chip_id = "207"
owned_memory_size = "0x100000000"
cpu_regs = "0"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"
